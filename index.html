<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music Player - Yêu Làm Chi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #8892b0;
            font-size: 14px;
        }
        
        .song-info {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .song-info .title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .song-info .artist {
            color: #64ffda;
            font-size: 14px;
        }
        
        .song-info .size {
            color: #8892b0;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .player {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        audio {
            width: 100%;
            margin-bottom: 10px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
        }
        
        .btn-primary {
            background: #64ffda;
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(100, 255, 218, 0.3);
        }
        
        .btn-danger {
            background: #ff6b6b;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }
        
        .btn-secondary {
            background: #4a4a6a;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            background: #5a5a7a;
        }
        
        .status {
            text-align: center;
            color: #8892b0;
            font-size: 13px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
        }
        
        .status.loading {
            color: #ffd93d;
        }
        
        .status.playing {
            color: #64ffda;
        }
        
        .status.error {
            color: #ff6b6b;
        }
        
        .status.done {
            color: #6bcbff;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #495670;
            font-size: 12px;
        }
        
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #64ffda, #6bcbff);
            border-radius: 2px;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Music Player</h1>
            <p>Phát và tải nhạc trực tiếp</p>
        </div>
        
        <div class="song-info">
            <div class="title">Yêu Làm Chi (#YLC)</div>
            <div class="artist">Fay x CM1X x Insolent</div>
            <div class="size">📁 3.63 MB</div>
        </div>
        
        <div class="player">
            <audio id="audioPlayer" controls style="display:none;"></audio>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" id="playBtn">▶️ Phát</button>
                <button class="btn btn-danger" id="stopBtn">⏹️ Dừng</button>
                <button class="btn btn-secondary" id="downloadBtn">⬇️ Tải về</button>
            </div>
        </div>
        
        <div class="status" id="status">⏸️ Sẵn sàng</div>
        <div class="footer">Made with ❤️ | Tự động xóa sau khi phát</div>
    </div>
    
    <script>
        // ====== CẤU HÌNH ======
        // Link raw của file MP3 trên GitHub
        const MP3_URL = 'https://raw.githubusercontent.com/ugmoddev/music-1/main/Y%C3%AAu%20L%C3%A0m%20Chi%20(%23YLC)%20-%20Fay%20x%20CM1X%20x%20Insolent.mp3';
        
        // ====== DOM ELEMENTS ======
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        
        // ====== BIẾN TRẠNG THÁI ======
        let isPlaying = false;
        let isLoaded = false;
        let progressInterval = null;
        
        // ====== CẬP NHẬT STATUS ======
        function setStatus(text, type = '') {
            status.textContent = text;
            status.className = 'status' + (type ? ' ' + type : '');
        }
        
        // ====== CẬP NHẬT PROGRESS ======
        function updateProgress() {
            if (audio.duration > 0) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        }
        
        // ====== TẢI VÀ PHÁT NHẠC ======
        function loadAndPlay() {
            if (isPlaying) {
                audio.pause();
                audio.currentTime = 0;
                isPlaying = false;
                playBtn.textContent = '▶️ Phát';
                setStatus('⏸️ Đã dừng');
                return;
            }
            
            setStatus('📥 Đang tải...', 'loading');
            playBtn.textContent = '⏳ Loading';
            playBtn.disabled = true;
            
            // Thiết lập nguồn audio
            audio.src = MP3_URL;
            audio.load();
            
            // Khi đã tải đủ dữ liệu để phát
            audio.addEventListener('canplaythrough', function onCanPlay() {
                audio.removeEventListener('canplaythrough', onCanPlay);
                isLoaded = true;
                playBtn.disabled = false;
                audio.play();
                isPlaying = true;
                playBtn.textContent = '⏸️ Tạm dừng';
                setStatus('▶️ Đang phát...', 'playing');
                
                // Cập nhật progress
                if (progressInterval) clearInterval(progressInterval);
                progressInterval = setInterval(updateProgress, 100);
            });
            
            // Xử lý lỗi tải
            audio.addEventListener('error', function onError() {
                audio.removeEventListener('error', onError);
                playBtn.disabled = false;
                playBtn.textContent = '▶️ Phát';
                setStatus('❌ Lỗi: Không thể tải file. Kiểm tra link!', 'error');
                console.error('Lỗi tải audio:', audio.error);
            });
        }
        
        // ====== DỪNG VÀ XÓA ======
        function stopAndDelete() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            
            audio.pause();
            audio.currentTime = 0;
            audio.src = '';
            audio.load();
            isPlaying = false;
            isLoaded = false;
            progressBar.style.width = '0%';
            playBtn.textContent = '▶️ Phát';
            playBtn.disabled = false;
            setStatus('🗑️ Đã dừng và xóa file khỏi bộ nhớ', 'done');
            
            // Giải phóng bộ nhớ
            if (audio.src) {
                URL.revokeObjectURL(audio.src);
            }
        }
        
        // ====== TẢI FILE VỀ MÁY ======
        function downloadFile() {
            setStatus('📥 Đang tải về...', 'loading');
            
            fetch(MP3_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Không thể tải file');
                    }
                    return response.blob();
                })
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Yeu_Lam_Chi_YLC_-_Fay_x_CM1X_x_Insolent.mp3';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    setStatus('✅ Đã tải xuống thành công!', 'done');
                })
                .catch(err => {
                    setStatus('❌ Lỗi tải: ' + err.message, 'error');
                    console.error('Lỗi tải file:', err);
                });
        }
        
        // ====== SỰ KIỆN ======
        
        // Nút Play
        playBtn.addEventListener('click', loadAndPlay);
        
        // Nút Stop
        stopBtn.addEventListener('click', stopAndDelete);
        
        // Nút Download
        downloadBtn.addEventListener('click', downloadFile);
        
        // Khi phát xong
        audio.addEventListener('ended', function() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            isPlaying = false;
            playBtn.textContent = '▶️ Phát lại';
            setStatus('✅ Đã phát xong!', 'done');
            progressBar.style.width = '100%';
            
            // Tự động xóa sau 3 giây
            setTimeout(() => {
                stopAndDelete();
                setStatus('🗑️ Đã xóa file (auto-exec)', 'done');
            }, 3000);
        });
        
        // Cập nhật progress khi đang phát
        audio.addEventListener('timeupdate', updateProgress);
        
        // ====== KHỞI TẠO ======
        setStatus('⏸️ Sẵn sàng. Nhấn "Phát" để nghe nhạc');
        console.log('🎵 Music Player đã sẵn sàng!');
        console.log('📁 File:', MP3_URL);
    </script>
</body>
</html>
